name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      # The route tree (src/routeTree.gen.ts) is generated by the Vite plugin
      # and gitignored, so build before type checking.
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Type check
        run: pnpm typecheck
